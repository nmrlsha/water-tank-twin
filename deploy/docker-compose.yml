services:
  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    restart: unless-stopped

  processor:
    build:
      context: ..
      dockerfile: processor/Dockerfile
    volumes:
      - tank_data:/app/data
    depends_on:
      - mosquitto
    restart: unless-stopped

  simulator:
    build:
      context: ..
      dockerfile: simulator/Dockerfile
    depends_on:
      - mosquitto
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: api/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - tank_data:/data
    environment:
      TANK_DB: /data/tank.db
    depends_on:
      - processor
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.0
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_INSTALL_PLUGINS: frser-sqlite-datasource
      GF_SECURITY_ADMIN_PASSWORD: change-me
    volumes:
      - tank_data:/data
      - grafana_data:/var/lib/grafana
    depends_on:
      - processor
    restart: unless-stopped

volumes:
  tank_data:
  grafana_data: